name: Windows Release
run-name: Compilar WR Lyrics Pro v0.2.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar código
        run: npm run lint

      - name: Gerar aplicativo portátil
        run: npm run dist:win

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: WR Lyrics Pro v0.2.0
          body: |
            Versão revisada com melhorias de estabilidade e operação.

            Inclui atalhos, cronômetro aprimorado, relógio de retorno em tempo real,
            tratamento seguro de caminhos de mídia e remoção consistente de conteúdos.
          files: dist/*.exe
          make_latest: true
